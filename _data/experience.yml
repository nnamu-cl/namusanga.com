- role: Senior HPC Engineer
  company: Jugo
  type: Contract
  mode: Remote
  location: United Kingdom
  start: 2026-03-01
  end: 2026-09-01
  logo: logo-jugo.jpg
  summary: >-
    Custom CUDA kernels for live AI video on Jugo's immersive meetings platform, which renders
    real-time 3D environments in Unreal Engine on cloud GPUs. Built the GPU compositing stage that
    injects game-engine frames into NVIDIA DeepStream, and cut P95 per-frame latency from 25.1 ms
    to 18.3 ms on RTX PRO 6000 Blackwell through Nsight-driven profiling.
  details:
    - >-
      Built and optimized custom CUDA kernels for live AI video processing on Jugo's immersive
      meetings platform, which renders real-time 3D environments in Unreal Engine on cloud GPUs.
    - >-
      Developed the GPU compositing stage that injects game-engine frames into NVIDIA DeepStream
      and overlays them with live video.
    - >-
      Optimized kernels on RTX PRO 6000 Blackwell, cutting P95 per-frame latency from 25.1 ms to
      18.3 ms and reducing jitter under high network latency. Nsight-driven profiling of compute
      and memory bound stages: occupancy, launch configuration and memory coalescing.
  skills:
    - HIP/ROCm
    - System Performance
    - C++
    - CUDA
    - High Performance Computing (HPC)
    - GPGPU
    - Performance Tuning

